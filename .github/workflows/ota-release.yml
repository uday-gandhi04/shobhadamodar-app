name: OTA Release

on:
  push:
    branches:
      - master
    paths:
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.*"
      - "frontend/capacitor.config.*"
      - "!frontend/android/**"
      - "!android/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # SETUP NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ======================================================
      # DETERMINE NEXT OTA VERSION
      # ======================================================

      - name: Determine next OTA version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.1"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "Latest version: ${LATEST_TAG:-none}"
          echo "Next OTA version: $NEXT_VERSION"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      # ======================================================
      # UPDATE FRONTEND VERSION
      # ======================================================

      - name: Update frontend version
        working-directory: frontend
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ======================================================
      # VERIFY BUILD ENVIRONMENT
      # ======================================================

      - name: Verify build environment
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://shobhadamodar-api.onrender.com/api' }}
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "❌ VITE_API_URL is empty"
            exit 1
          fi

          echo "✅ VITE_API_URL is $VITE_API_URL"

      # ======================================================
      # BUILD FRONTEND
      # ======================================================

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://shobhadamodar-api.onrender.com/api' }}
        run: npm run build

      # ======================================================
      # VERIFY PRODUCTION BUILD
      # ======================================================

      - name: Verify production build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://shobhadamodar-api.onrender.com/api' }}
        shell: bash
        run: |
          echo "Checking production build..."

          if [ ! -d "dist" ]; then
            echo "❌ dist directory was not created"
            exit 1
          fi

          if grep -R -F -q "$VITE_API_URL" dist; then
            echo "✅ Backend API URL is present in production build"
          else
            echo "❌ Backend API URL is NOT present in production build"
            echo "Expected API URL: $VITE_API_URL"
            exit 1
          fi

          if grep -R -F -q "http://10.0.2.2:5000" dist; then
            echo "❌ Emulator loopback URL 10.0.2.2 found in production build"
            exit 1
          fi

      # ======================================================
      # CREATE OTA ZIP
      # ======================================================

      - name: Generate OTA bundle
        working-directory: frontend
        run: |
          npx @capgo/cli bundle zip \
            --path ./dist \
            --json

      # ======================================================
      # FIND OTA ZIP
      # ======================================================

      - name: Find OTA bundle
        id: bundle
        shell: bash
        run: |
          FILE=$(find frontend \
            -maxdepth 1 \
            -type f \
            -name "com.shobhadamodar.app_${{ steps.version.outputs.version }}.zip" \
            -print \
            -quit)

          if [ -z "$FILE" ]; then
            echo "❌ OTA bundle not found"
            exit 1
          fi

          echo "OTA bundle found: $FILE"

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      # ======================================================
      # CALCULATE CHECKSUM
      # ======================================================

      - name: Calculate checksum
        id: checksum
        shell: bash
        run: |
          CHECKSUM=$(sha256sum \
            "${{ steps.bundle.outputs.file }}" \
            | awk '{print $1}')

          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      # ======================================================
      # CREATE GITHUB RELEASE
      # ======================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "v${{ steps.version.outputs.version }}" \
            "${{ steps.bundle.outputs.file }}" \
            --title "ShobhaDamodar Petroleum ${{ steps.version.outputs.version }}" \
            --generate-notes

      # ======================================================
      # UPDATE OTA MANIFEST
      # ======================================================

      - name: Update OTA manifest
        shell: bash
        run: |
          mkdir -p ota

          cat > ota/latest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/com.shobhadamodar.app_${{ steps.version.outputs.version }}.zip",
            "checksum": "${{ steps.checksum.outputs.checksum }}"
          }
          EOF

      # ======================================================
      # COMMIT VERSION + MANIFEST
      # ======================================================

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            frontend/package.json \
            frontend/package-lock.json \
            ota/latest.json

          if git diff --cached --quiet; then
            echo "No release metadata changes to commit"
          else
            git commit \
              -m "Release ShobhaDamodar Petroleum ${{ steps.version.outputs.version }} [skip ci]"

            git push origin HEAD:master
          fi
